<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="shortcut icon" href="./assets/img/favicon.png" type="image/x-icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Pingüino API Canvas</title>
</head>

<body>

    <!-- ===== NAV ===== -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container text-center text-white">
            <div>
                <h4 class="mb-1">Graficación con API Canvas</h4>
                <p class="mb-0">
                    Programa: Dibujo de un Pingüino construido mediante
                    30 figuras usando HTML5 Canvas
                </p>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="container-fluid main-container">

        <div class="row h-100 align-items-center">

            <!-- IZQUIERDA (Canvas irá aquí) -->
            <section class="col-md-6 canvas-section">
                <div class="canvas-box">
                    <!-- Aquí después insertaremos tu canvas -->
                 <canvas id="canvas" width="500" height="500"></canvas>
                </div>
            </section>

            <!-- DERECHA (Imagen referencia) -->
            <section class="col-md-6 image-section text-center">
                <img src="./assets/img/imagen.png"
                     alt="Imagen referencia pingüino"
                     class="img-fluid reference-img">
            </section>

        </div>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer bg-dark text-white text-center">
        <p class="mb-1">Examen de Graficación</p>
        <p class="mb-1">
            Jesús Nicolás Vite
        </p>
           <p class="mb-1">
            Num Control: 241064039
        </p>
    </footer>

    <script src="./assets/js/main.js"></script>

</body>
</html>
